name: Profile assets

# Generates every self-hosted widget in the README:
#   1. snake        -> contribution snake, pushed to the `output` branch
#   2. summary-cards -> stats cards, committed to profile-summary-card-output/ on main
#
# There is deliberately NO `push` trigger: the summary-cards job commits to main,
# and a push trigger would make the workflow re-trigger itself forever.
# Run it once by hand from the Actions tab, then it keeps itself fresh daily.

on:
  schedule:
    - cron: "0 0 * * *"   # daily, midnight UTC
  workflow_dispatch:      # the "Run workflow" button in the Actions tab

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 5   # Asia/Colombo, for the "productive time" card
