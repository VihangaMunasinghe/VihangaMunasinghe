<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Vihanga Munasinghe — Computer Science and Engineering">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#171a2e"/>
      <stop offset="1" stop-color="#1a1b27"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="250" y1="0" x2="750" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#7dcfff;#9ece6a;#7aa2f7" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7dcfff">
        <animate attributeName="stop-color" values="#7dcfff;#9ece6a;#7aa2f7;#bb9af7;#7dcfff" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="300" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dcfff" stop-opacity="1"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c0caf5" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <rect width="1000" height="200" fill="url(#bgGrad)"/>

  <g filter="url(#soft)" opacity="0.42">
    <circle cx="200" cy="70" r="72" fill="#7aa2f7">
      <animate attributeName="cx" values="200;340;200" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;140;70" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="140" r="82" fill="#bb9af7">
      <animate attributeName="cx" values="800;650;800" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="140;50;140" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="30" r="58" fill="#7dcfff">
      <animate attributeName="cy" values="30;170;30" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="1000" height="200" fill="url(#grid)"/>

  <text x="500" y="94" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="46" font-weight="700" letter-spacing="2" fill="url(#nameGrad)">Vihanga Munasinghe</text>

  <text x="500" y="124" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="13" font-weight="500" letter-spacing="5" fill="#a9b1d6">COMPUTER SCIENCE &amp; ENGINEERING &#183; AI &#183; CLOUD &#183; MOBILE</text>

  <rect x="300" y="142" width="400" height="2" rx="1" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="4s" repeatCount="indefinite"/>
  </rect>

  <g>
    <path d="M-100 176 C 60 156, 260 196, 420 176 S 780 156, 1100 176 L1100 220 L-100 220 Z" fill="#7aa2f7" opacity="0.15">
      <animateTransform attributeName="transform" type="translate" values="0 0; -45 4; 0 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M-100 184 C 120 167, 320 202, 540 184 S 880 170, 1100 184 L1100 220 L-100 220 Z" fill="#bb9af7" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" values="0 0; 45 -3; 0 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
